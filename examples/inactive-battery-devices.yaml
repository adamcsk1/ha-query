type: custom:ha-query-card
title: Inactive battery devices (14+ days)
group_by: area
refresh_seconds: 21600
query:
  from: devices
  where:
    has_entity:
      field: entity.attributes.device_class
      op: eq
      value: battery
    history:
      no_changes_for: 14d # Recorder must be running with enough retained history.
      scope: all_entities
  columns:
    - device.name
    - battery.level
    - history.last_change
    - history.days_inactive
  sort:
    by: history.days_inactive
    descending: true
  limit: 100
