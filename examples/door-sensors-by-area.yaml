type: custom:ha-query-card
title: Door sensors
group_by: area
state_color: true
entity_links: true
entity_icons: true
entity_icon_overrides:
  binary_sensor.front_door: mdi:door-open # Replace with your exact entity IDs.
entity_names:
  binary_sensor.front_door: Front entrance # Replace with your exact entity IDs.
state_labels:
  "on": Open
  "off": Closed
  unknown: Unknown
  unavailable: Offline
refresh_seconds: 60
query:
  from: entities
  where:
    domain: binary_sensor
    device_class: door
  columns:
    - entity.name
    - entity.state
  sort:
    by: entity.name
  limit: 100
